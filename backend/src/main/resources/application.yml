spring:
  application:
    name: wedding-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wedding}
    username: ${DB_USERNAME:wedding}
    password: ${DB_PASSWORD:wedding}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 50
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:12MB}
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  timezone: Asia/Ho_Chi_Minh
  jwt:
    # Base64 or plain text secret with at least 32 bytes. Required in production.
    secret: ${APP_JWT_SECRET:}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
    issuer: wedding-management
  admin:
    # Initial administrator account, created only when the users table is empty.
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    full-name: ${APP_ADMIN_FULL_NAME:Quản trị viên}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./uploads}
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_BYTES:10485760}
    allowed-content-types: image/jpeg,image/png,image/webp,image/gif,application/pdf
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8081,http://127.0.0.1:8081}
  seed:
    demo-data: ${APP_SEED_DEMO_DATA:false}

logging:
  level:
    root: INFO
    com.wedding.management: ${APP_LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN
